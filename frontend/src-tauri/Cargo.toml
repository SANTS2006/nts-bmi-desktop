[package]
name = "nts-bmi"
version = "1.0.0"
description = "NTS Business Management Intelligence desktop application"
authors = ["NTS Digital Solutions"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nts_bmi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
