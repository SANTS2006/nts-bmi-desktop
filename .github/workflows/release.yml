name: Release NTS BMI Desktop

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release NTS BMI
    runs-on: windows-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------------
      # 3. Install Rust
      # ------------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------
      # 4. Install frontend dependencies
      # ------------------------------------------------------------
      - name: Install frontend dependencies
        run: npm ci

      # ------------------------------------------------------------
      # 5. Generate Tauri desktop icons
      # ------------------------------------------------------------
      - name: Generate desktop icons
        run: npm run desktop:icons

      # ------------------------------------------------------------
      # 6. Verify updater signing credentials
      #
      # This is intentionally done BEFORE the Tauri build.
      #
      # It tests the exact GitHub Actions secrets:
      #
      #   TAURI_SIGNING_PRIVATE_KEY
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      #
      # without exposing either value in the logs.
      # ------------------------------------------------------------
      - name: Verify Tauri signing credentials
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Tauri signing credentials..."

          # Confirm that the private key secret was supplied.
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing or empty."
          }

          # Confirm that the password secret was supplied.
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing or empty."
          }

          # Do NOT print either secret.
          Write-Host "Private signing key secret: present"
          Write-Host "Signing password secret: present"

          # Create a temporary file for the signing test.
          $testFile = Join-Path $env:RUNNER_TEMP "tauri-sign-test.txt"

          "NTS BMI Tauri signing test" |
            Set-Content -Path $testFile -NoNewline

          Write-Host "Running Tauri signer test..."

          # This uses the exact environment variables above.
          npx tauri signer sign $testFile

          # The signer should create a .sig file.
          $signatureFile = "$testFile.sig"

          if (-not (Test-Path $signatureFile)) {
            throw "Tauri signing test failed: .sig file was not created."
          }

          Write-Host "Tauri signing test succeeded."
          Write-Host "The GitHub Actions signing key and password are valid."

      # ------------------------------------------------------------
      # 7. Build and publish the desktop application
      # ------------------------------------------------------------
      - name: Build and publish NTS BMI
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Production backend
          VITE_API_URL: ${{ secrets.NTS_BMI_API_URL }}

          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          projectPath: frontend

          # For tag releases this is v1.0.2, v1.0.3, etc.
          tagName: ${{ github.ref_name }}

          releaseName: NTS BMI ${{ github.ref_name }}

          releaseBody: |
            ## NTS BMI ${{ github.ref_name }}

            ### What's included

            - NTS BMI desktop application updates
            - Automatic update support
            - Signed desktop releases
            - Security and stability improvements

            ### System requirements

            - Windows 10/11
            - 64-bit
            - Internet connection required

          # Publish release immediately.
          releaseDraft: false
          prerelease: false

          # Generate and upload updater metadata.
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

          # Prefer the Windows NSIS installer for updater metadata.
          updaterJsonPreferNsis: true

          # Let GitHub generate release notes.
          generateReleaseNotes: true